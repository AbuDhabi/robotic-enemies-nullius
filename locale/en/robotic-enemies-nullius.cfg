[entity-description]
nullius-stone-wall=Crude fortification of stone brick. Half as durable as reinforced walls from Architecture, but available once masonry is established.
nullius-gun-turret=Automated bullet turret. Each shot consumes 10 J of electricity.
nullius-acid-turret=Automated acidthrower. Sprays sulfuric acid from a fluid connection, leaving slowing acid puddles on the ground.
ren-data-collector=Hub of a hostile surface outpost, linked to subsurface installations. Monitors technological signatures; when artificial electromagnetic activity exceeds local thresholds, it dispatches mobile units. Deployed forces grow bolder and better-equipped as hostile learning algorithms adapt to countermeasures.
ren-enemy-android=Light hostile scout. First wave of an automated response. Fights at close range. Common before heavier units are committed.
ren-enemy-buggy=Fast hostile raider that probes and harasses intruder infrastructure. Appears once the hostile AI commits beyond scout-only responses.
ren-enemy-tank=Armored hostile assault tank with a cannon turret. Backbone of mid-tier incursion forces.
ren-enemy-kamikaze=Single-use hostile harrier. Detonates on contact with explosive force.
ren-enemy-spider=Heavily armed hostile walker. Deployed when subsurface command rates the intruder a serious threat.
ren-enemy-laser-turret=Hostile laser emplacement. Powered from the outpost grid.
ren-enemy-flamethrower-turret=Hostile flamethrower emplacement. Powered from the outpost grid.
ren-enemy-roboport=Field assembler that maintains and rebuilds hostile surface equipment.
ren-enemy-solar-panel=Surface energy collector feeding the outpost grid. Most hostile industry remains underground; only essentials break the surface.
ren-enemy-small-electric-pole=Short relay mast for local outpost power.
ren-enemy-medium-electric-pole=Medium relay mast with extended reach.
ren-enemy-big-electric-pole=Long-range relay mast for outpost backbones.
ren-enemy-substation=Distribution hub for the outpost power network.
ren-land-mine=Hostile perimeter mine. Impairs movement on detonation rather than fully immobilizing targets. Still inflicts explosive damage.
