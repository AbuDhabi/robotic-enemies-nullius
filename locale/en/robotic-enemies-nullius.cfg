[item-description]
nullius-stone-wall=Crude fortification of stone brick. Half as durable as reinforced walls from Architecture, but available once masonry is established.
nullius-grenade=Hand-thrown explosive charge. Built from a methanol canister and an iron plate.
nullius-gun-turret=Automated bullet turret. Draws 10 J of electricity per shot.
nullius-acid-turret=Automated acidthrower. Sprays sulfuric acid from a fluid connection, leaving slowing acid puddles on the ground.

