nullius-robotic-defense-1=Robotic defense
nullius-self-defense-1=Self Defense 1
nullius-self-defense-2=Self Defense 2
nullius-automated-defense-1=Automated Defense 1
nullius-automated-defense-2=Automated Defense 2
nullius-projectile-improvements=Projectile Improvements

[technology-description]
nullius-robotic-defense-1=Unlocks rifles, laser turrets, and advanced magazines to repel robotic incursions on Nauvis.
nullius-self-defense-1=Unlocks grenades for close-range explosive defense, craftable by hand or in small and medium assemblers.
nullius-self-defense-2=Unlocks the gun and an improvised magazine recipe that uses improvised explosives to yield half as many magazines as the standard recipe.
nullius-automated-defense-1=Unlocks an electric gun turret for automated base defense.
nullius-automated-defense-2=Unlocks a flamethrower turret that fires benzene.
nullius-projectile-improvements=Increases bullet damage and shooting speed for guns and bullet turrets.

