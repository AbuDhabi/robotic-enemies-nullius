[mod-setting-name]
ren-enable-robotic-enemies=Enable robotic enemies on Nauvis
ren-enable-auto-targeting=Enable weapon auto-targeting

[mod-setting-description]
ren-enable-robotic-enemies=When disabled, no enemy bases are generated (for testing or peaceful play).
ren-enable-auto-targeting=Nullius demolition ammo normally shoots at the ground and does not snap to enemies. Enable this so guns, rifles, and missiles auto-target robotic enemies. Disable to restore Nullius demolition behavior (requires restart).

[technology-name]
nullius-robotic-defense-1=Robotic defense

[technology-description]
nullius-robotic-defense-1=Unlocks rifles, laser turrets, and advanced magazines to repel robotic incursions on Nauvis.

