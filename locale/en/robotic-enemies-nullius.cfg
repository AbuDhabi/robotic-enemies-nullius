[item-description]
nullius-stone-wall=Early defensive wall made from stone bricks. Half as durable as reinforced walls unlocked by Architecture.
nullius-grenade=Throwable explosive similar to a vanilla grenade. Crafted from a methanol canister and an iron plate.
nullius-gun-turret=Automated gun turret based on the vanilla design. Consumes 10 J of electricity per shot.
nullius-flamethrower-turret=Automated flamethrower turret based on the vanilla design. Fires benzene from a fluid connection.

