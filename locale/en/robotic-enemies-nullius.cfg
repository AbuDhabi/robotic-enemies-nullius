[mod-setting-name]
ren-enable-robotic-enemies=Enable hostile incursions on Nauvis
ren-enable-auto-targeting=Enable anti-hostile targeting

[mod-setting-description]
ren-enable-robotic-enemies=When disabled, hostile surface outposts are not generated (for testing or an undisturbed terraforming run).
ren-enable-auto-targeting=Nullius demolition weapons are built for demolition, not pursuit. Enable this so guns, rifles, and missiles acquire hostile units. Disable to restore default Nullius behavior (requires restart).

[technology-name]
nullius-robotic-defense-1=Anti-incursion systems
nullius-self-defense-1=Personal countermeasures 1
nullius-self-defense-2=Personal countermeasures 2
nullius-automated-defense-1=Automated countermeasures 1
nullius-automated-defense-2=Automated countermeasures 2
nullius-projectile-improvements=Projectile improvements

[technology-description]
nullius-robotic-defense-1=Unlocks rifles, laser turrets, and advanced magazines for engaging hostile surface forces on Nauvis.
nullius-self-defense-1=Unlocks grenades for close-range defense when hostile scouts breach the perimeter. Craftable by hand or in small and medium assemblers.
nullius-self-defense-2=Unlocks a compact firearm and an improvised magazine recipe for early defense before full demolitions production is available.
nullius-automated-defense-1=Unlocks an electric gun turret to suppress technological signatures and hold hostile probes away from critical infrastructure.
nullius-automated-defense-2=Unlocks an acidthrower turret for area denial against massed hostile units.
nullius-projectile-improvements=Refines bullet weapons against increasingly adaptive hostile armor and tactics. Increases bullet damage and firing speed for guns and bullet turrets.

