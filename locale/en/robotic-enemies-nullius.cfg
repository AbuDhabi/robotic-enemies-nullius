[entity-description]
nullius-stone-wall=Early defensive wall made from stone bricks. Half as durable as reinforced walls unlocked by Architecture.
nullius-gun-turret=Automated gun turret that fires bullet ammunition. Consumes 10 J of electricity per shot.
nullius-flamethrower-turret=Automated flamethrower turret that fires a stream of benzene.
ren-data-collector=Robotic base hub. Spawns androids, buggies, battle tanks, kamikaze drones, and spidertrons as pollution rises and evolution advances.
ren-enemy-android=Melee android resembling an engineer in light armor. Appears at the lowest evolution, before buggies.
ren-enemy-buggy=Fast autonomous car that harasses nearby factories. Appears once evolution rises above android-only levels.
ren-enemy-tank=Heavily armored battle tank that fires vanilla cannon shells from its turret.
ren-enemy-kamikaze=Flying suicide drone resembling a Defender robot. Detonates like an explosive rocket when it reaches a target.
ren-enemy-spider=Heavily armed spidertron that appears at high evolution.
ren-enemy-laser-turret=Enemy laser turret powered by the base grid.
ren-enemy-flamethrower-turret=Enemy flamethrower turret powered by the base grid.
ren-enemy-roboport=Enemy roboport that repairs nearby robotic structures.
ren-enemy-solar-panel=Enemy solar panel supplying the base grid.
ren-enemy-small-electric-pole=Enemy power pole.
ren-enemy-medium-electric-pole=Enemy power pole.
ren-enemy-big-electric-pole=Enemy power pole.
ren-enemy-substation=Enemy substation.
ren-land-mine=Slows movement on detonation instead of a full stun. Still deals explosion damage.
